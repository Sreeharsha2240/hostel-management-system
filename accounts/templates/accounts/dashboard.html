<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard · HMS</title></head>
<body>
  <main>
    <h1>{{ role }} dashboard</h1>
    <p>Signed in as {{ request.user.username }}.</p>
    {% if request.user.role == 'admin' %}<p><a href="{% url 'user-management' %}">Manage user accounts</a></p><p><a href="{% url 'audit-events' %}">View audit events</a></p>{% endif %}
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>
  </main>
</body>
</html>
