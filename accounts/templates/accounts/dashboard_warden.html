<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Warden dashboard · HMS</title></head>
<body>
  <main>
    <h1>Warden dashboard</h1>
    <p>Signed in as {{ request.user.username }}.</p>
    <section aria-labelledby="warden-tools-heading">
      <h2 id="warden-tools-heading">Hostel operations</h2>
      <p>Student, room and allocation tools will appear here as those modules become available.</p>
    </section>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>
  </main>
</body>
</html>
