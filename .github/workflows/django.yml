
name: Django Tests

on:
  push:
    branches:
      - feature/student-hostel-management
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: hms
          MYSQL_USER: hms
          MYSQL_PASSWORD: hms_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_SECRET_KEY: ci-test-only-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: hms
      DB_USER: hms
      DB_PASSWORD: hms_test_password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DJANGO_SESSION_COOKIE_SECURE: "False"
      DJANGO_CSRF_COOKIE_SECURE: "False"
      DJANGO_SECURE_SSL_REDIRECT: "False"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install MySQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Grant MySQL test database permissions
        run: |
          mysql -h 127.0.0.1 -uroot -proot_test_password -e "GRANT ALL PRIVILEGES ON *.* TO 'hms'@'%'"

      - name: Check Django configuration
        run: python manage.py check

      - name: Run all tests and generate JUnit report
        run: |
          set -o pipefail
          python manage.py test --testrunner=xmlrunner.extra.djangotestrunner.XMLTestRunner --no-input 2>&1 | tee test-results.txt

      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-test-evidence-${{ github.sha }}
          path: test-results.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-test-results
          path: TEST-*.xml
          if-no-files-found: error
          retention-days: 14
