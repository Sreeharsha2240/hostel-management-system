{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <h1>{{ heading }}</h1>
  {% if allocation %}<p>{{ allocation.student.name }} · {{ allocation.bed }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions"><button type="submit">Confirm</button><a class="button secondary" href="{% url 'allocation-list' %}">Cancel</a></div>
  </form>
</section>
{% endblock %}
